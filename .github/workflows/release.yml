name: build-and-release

# Builds the Lua 5.4 Ghidra extension from a SINGLE source against one or more Ghidra
# versions, and on a v* tag attaches every produced zip to one GitHub Release. Each zip is
# stamped with the version of the Ghidra it was built against and installs only into a
# matching Ghidra (Ghidra's check is an exact application.version match), so we ship one
# zip per target version rather than a single cross-version file.
#
#  * build-public : GitHub-hosted; downloads the pinned PUBLIC release (tag + SHA-256,
#    verified) -> the zip for external public-release users.
#  * build-ours   : opt-in; runs only when the repo variable GHIDRA_INSTALL_DIR points at a
#    TRUSTED self-built Ghidra on a self-hosted runner (RUNNER_LABELS). No download; the
#    build is hermetic (buildExtension --offline, no third-party deps) -> the zip for that
#    build.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GHIDRA_TAG: Ghidra_12.2_build   # public target
  # SHA-256 of ghidra_12.2_PUBLIC_20261016.zip (from GitHub's release asset digest;
  # cross-checkable against the NSA release page). A pin = version + this immutable id.
  GHIDRA_SHA256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"

jobs:
  build-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      # IMPORTANT: Ghidra is downloaded/unpacked OUTSIDE the repo checkout ($RUNNER_TEMP),
      # so buildExtension (which zips the module directory) never sweeps it into the
      # extension zip. Keeping it in the repo root produced a ~1 GB zip.
      - name: Cache Ghidra release zip
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghidra.zip
          key: ghidra-zip-${{ env.GHIDRA_TAG }}-${{ env.GHIDRA_SHA256 }}
      - name: Download pinned public Ghidra (cache miss only)
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/${GHIDRA_TAG}"
          url=$(curl -fsSL -H "Accept: application/vnd.github+json" "$api" \
                | jq -r '.assets[] | select(.name | test("ghidra_.*_PUBLIC_.*\\.zip$")) | .browser_download_url' | head -1)
          [ -n "$url" ] && [ "$url" != "null" ] || { echo "::error::Cannot resolve Ghidra asset for ${GHIDRA_TAG}"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/ghidra.zip" "$url"
      - name: Verify checksum & unpack Ghidra (outside the repo)
        run: |
          set -euo pipefail
          z="$RUNNER_TEMP/ghidra.zip"
          if [ -z "${GHIDRA_SHA256}" ]; then
            echo "::error::GHIDRA_SHA256 is not set. A pin is a version PLUS an immutable identifier; the tag alone is not a pin."
            [ -f "$z" ] && { echo "zip SHA-256 (verify against the NSA release page, then set GHIDRA_SHA256):"; sha256sum "$z"; }
            exit 1
          fi
          # Verified on every run, including cache hits (the cache key is also pinned to the SHA).
          echo "${GHIDRA_SHA256}  ${z}" | sha256sum -c -
          unzip -q "$z" -d "$RUNNER_TEMP/ghidra_install"
          dir=$(find "$RUNNER_TEMP/ghidra_install" -maxdepth 1 -type d -name 'ghidra_*_PUBLIC*' | head -1)
          [ -n "$dir" ] || { echo "::error::Ghidra install dir not found"; exit 1; }
          echo "GHIDRA_INSTALL_DIR=$dir" >> "$GITHUB_ENV"
      - name: Compile SLEIGH
        run: |
          "${GHIDRA_INSTALL_DIR}/support/sleigh" data/languages/lua54.slaspec
      - name: Build extension (offline)
        run: gradle buildExtension -PGHIDRA_INSTALL_DIR="${GHIDRA_INSTALL_DIR}" --offline
      - name: Name the asset
        run: |
          set -euo pipefail
          cd dist
          f=$(ls ghidra_*_LuaBytecode.zip)
          ver=$(printf '%s' "$f" | sed -E 's/^ghidra_([0-9]+\.[0-9]+(\.[0-9]+)?)_.*/\1/')
          mv "$f" "LuaBytecode-ghidra-extension-${ver}.zip"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ext-public
          path: dist/*.zip
          if-no-files-found: error

  build-ours:
    # Runs only when a trusted self-built Ghidra is configured.
    if: ${{ vars.GHIDRA_INSTALL_DIR != '' }}
    runs-on: ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'self-hosted' }}
    env:
      PROVIDED_GHIDRA: ${{ vars.GHIDRA_INSTALL_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Build against trusted Ghidra (hermetic, no download)
        run: |
          set -euo pipefail
          test -x "${PROVIDED_GHIDRA}/support/sleigh" || { echo "::error::GHIDRA_INSTALL_DIR invalid"; exit 1; }
          "${PROVIDED_GHIDRA}/support/sleigh" data/languages/lua54.slaspec
          gradle buildExtension -PGHIDRA_INSTALL_DIR="${PROVIDED_GHIDRA}" --offline
      - name: Name the asset
        run: |
          set -euo pipefail
          cd dist
          f=$(ls ghidra_*_LuaBytecode.zip)
          ver=$(printf '%s' "$f" | sed -E 's/^ghidra_([0-9]+\.[0-9]+(\.[0-9]+)?)_.*/\1/')
          mv "$f" "LuaBytecode-ghidra-extension-${ver}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ext-ours
          path: dist/*.zip
          if-no-files-found: error

  derive-12.3:
    # Ghidra 12.3 is not public yet, so there is nothing to download/build against on a
    # hosted runner. When no trusted self-built 12.3 is configured (build-ours), derive the
    # 12.3 asset from the 12.2 build by relabeling its version field: the 12.2 and 12.3
    # extension bundles were verified byte-identical apart from that field. Skipped when
    # build-ours produces a genuine 12.3 build, so there is never a duplicate 12.3 asset.
    needs: build-public
    if: ${{ vars.GHIDRA_INSTALL_DIR == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the 12.2 build
        uses: actions/download-artifact@v4
        with:
          name: ext-public
          path: in
      - name: Relabel 12.2 build as 12.3
        run: |
          set -euo pipefail
          src=$(ls in/LuaBytecode-ghidra-extension-*.zip | head -1)
          rm -rf work out && mkdir work out
          (cd work && unzip -q "../$src")
          perl -i -pe 's/^version=.*/version=12.3/' work/LuaBytecode/extension.properties
          (cd work && zip -qr "../out/LuaBytecode-ghidra-extension-12.3.zip" LuaBytecode)
          unzip -p out/LuaBytecode-ghidra-extension-12.3.zip 'LuaBytecode/extension.properties' | grep -E '^name=|^version='
      - uses: actions/upload-artifact@v4
        with:
          name: ext-derived-12.3
          path: out/*.zip
          if-no-files-found: error

  release:
    needs: [ build-public, build-ours, derive-12.3 ]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect all built zips
        uses: actions/download-artifact@v4
        with:
          pattern: ext-*
          path: release-zips
          merge-multiple: true
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-zips/*.zip
          body: |
            Lua 5.4 bytecode Ghidra extension — one zip per Ghidra version.
            Pick the zip whose version matches your Ghidra, then:
            File ▸ Install Extensions ▸ green **+** ▸ select the zip ▸ restart Ghidra.

            ---

            **About the 12.3 asset.** Ghidra 12.3 is not yet publicly released, so the 12.3
            zip is the 12.2 build with its `version` field set to `12.3` — the two bundles
            are byte-identical apart from that field. This equivalence was validated against
            a Ghidra 12.3-DEV build at upstream revision `e45e5a62fd`
            (`Ghidra_12.2_build-544-ge45e5a62fd`). Because 12.3-DEV is a moving target, build
            the extension from source against your own Ghidra if your 12.3-DEV differs.
